<!DOCTYPE html>
<html>
<head>
    <title>AI Stock Predictor</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <h1>📈 AI Stock Price Predictor</h1>

    <div class="input-section">
        <input type="text" id="ticker" placeholder="Enter Stock (AAPL)">
        <input type="number" id="days" placeholder="Days to Predict">
        <button onclick="predictStock()">Predict</button>
    </div>

    <div id="loading" class="hidden">⏳ Predicting...</div>

    <h3 id="accuracy"></h3>

    <canvas id="chart"></canvas>
</div>

<script src="script.js"></script>
</body>
</html>
